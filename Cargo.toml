[package]
name = "miko"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
flate2 = "1"
zstd = "0.13"
# rustls 内联根证书（webpki-roots），不链接系统 OpenSSL：
# 便于 aarch64 交叉编译 / Armbian 上单文件静态部署。
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
sha2 = "0.10"
tempfile = "3"
libc = "0.2"
nix = { version = "0.31", features = ["sched", "mount", "process", "signal", "fs", "user", "hostname", "resource"] }

[profile.release]
strip = true
